spring:
  application:
    name: products
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/products}
    username: ${DB_USER:products_app}
    password: ${DB_PASSWORD:products_app}
    hikari:
      # Starting point; final value to be decided with the benchmark.
      maximum-pool-size: 5
      minimum-idle: 5

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    token-validity: 1h