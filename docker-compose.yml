version: "3.9"

services:
  db:
    image: postgres:16
    container_name: product-db
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    # Starting values; tune max_connections to the Hikari pool size (+ margin for pgAdmin).
    command: ["postgres", "-c", "max_connections=10", "-c", "shared_buffers=256MB"]
    volumes:
      # Scripts run in alphabetical order, and ONLY when the data directory is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/products
      DB_USER: products_app
      DB_PASSWORD: products_app
      TZ: Europe/Madrid
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
    depends_on:
      db:
        condition: service_healthy
    command: >
      java -cp app.jar com.mango.App
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    container_name: product-benchmark
    depends_on:
      - app
    command: sh -c "chmod +x /app/benchmark.sh && /app/benchmark.sh"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
