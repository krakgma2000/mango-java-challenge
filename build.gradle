plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.6'
}

group = 'com.mango'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Fixed name, so the Dockerfiles copy the jar by name. The plain jar stays enabled: the native image
// build (nativeCompile) takes the application classes from it.
tasks.named('bootJar') {
	archiveFileName = 'mango-app.jar'
}

//Native image same name as the jar but built with ./gradlew nativeCompile
graalvmNative {
	binaries {
		main {
			imageName = 'mango-app'
		}
	}
}
